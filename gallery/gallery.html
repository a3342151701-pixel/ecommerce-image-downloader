<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品图片</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="topbar">
    <div class="heading">
      <p class="eyebrow" id="site-name">商品图片</p>
      <h1 id="page-title">正在读取图片</h1>
      <p class="meta"><span id="total-count">0</span> 张 · 已选 <span id="selected-count">0</span> 张</p>
    </div>
    <div class="actions">
      <button type="button" id="select-all">全选</button>
      <button type="button" id="select-none">取消全选</button>
      <button type="button" id="download" class="primary" disabled>下载所选</button>
    </div>
  </header>
  <p class="status" id="status" hidden></p>
  <main id="grid" class="grid"></main>
  <div class="lightbox" id="lightbox" hidden>
    <button type="button" class="lightbox-backdrop" id="lightbox-close" aria-label="关闭预览"></button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>
  <script src="../lib/download-numbering.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
